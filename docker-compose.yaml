version: '3.8'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=123456
      - xpack.security.enabled=true
    volumes:
      - esdata:/usr/share/elasticsearch/data # Persistent volume for Elasticsearch data
      - ./certs:/usr/share/elasticsearch/config/certs

  botservice:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./uploads:/app/uploads
      - ${STORAGE_DIR_HOST}:/app/documents # Ensure this directory exists and has proper permissions
      #- C:/projects/knowledge-hub/documents:/app/documents
    depends_on:
      - redis
      - elasticsearch
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development} # Use development by default or set in .env for deployment
      # MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      DATABASE_URL: ${DATABASE_URL:-mysql://root:@host.docker.internal:3306/chatbot_db}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    command: [ "sh", "-c", "npm install && npm run prisma:generate && npm run start:${NODE_ENV}" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 3g
        reservations:
          memory: 1g
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  redis:
    image: redis:latest
    container_name: redis_container
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - ./queue-data:/root/redis
      - ./queue-conf/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      REDIS_PORT: 6379
      REDIS_DATABASES: 16

volumes:
  uploads:
    driver: local
  esdata:
    driver: local
