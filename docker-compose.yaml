version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=123456
      - xpack.security.enabled=false # TEMPORARY for debugging, enable in production
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - ./certs:/usr/share/elasticsearch/config/certs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://elasticsearch:9200/_cluster/health?wait_for_status=yellow&timeout=5s" ]
      interval: 10s
      timeout: 5s
      retries: 10

  botservice:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./uploads:/app/uploads
      - ${STORAGE_DIR_HOST:-./documents}:/app/documents
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    command: [ "sh", "-c", "npx prisma generate && npm run start:production" ]
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://botservice:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 3g
        reservations:
          memory: 1g
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  redis:
    image: redis:latest
    container_name: redis_container
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - ./queue-data:/root/redis
      - ./queue-conf/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      REDIS_PORT: 6379
      REDIS_DATABASES: 16
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  esdata:
    driver: local
